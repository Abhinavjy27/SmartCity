# ==============================================================================
# SUPADSP — Docker Compose (Development)
# ==============================================================================
# Usage:
#   docker compose up -d                  # Start all infrastructure services
#   docker compose up -d postgres redis   # Start specific services
#   docker compose down                   # Stop all services
#   docker compose logs -f postgres       # Follow logs for a service
# ==============================================================================

version: "3.9"

services:
  # ---- PostgreSQL + PostGIS + TimescaleDB ----
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: supadsp-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supadsp}
      POSTGRES_USER: ${POSTGRES_USER:-supadsp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supadsp_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: supadsp-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- MinIO (S3-compatible Object Storage) ----
  minio:
    image: minio/minio:latest
    container_name: supadsp-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ---- Apache Kafka (KRaft Mode - ZooKeeper-less) ----
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: supadsp-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ---- Keycloak ----
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: supadsp-keycloak
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-supadsp}
      KC_DB_USERNAME: ${POSTGRES_USER:-supadsp_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- MLflow ----
  mlflow:
    image: ghcr.io/mlflow/mlflow:2.14.0
    container_name: supadsp-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-supadsp_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://model-artifacts
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme123}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: mlflow server --host 0.0.0.0 --port 5000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ---- GeoServer ----
  geoserver:
    image: kartoza/geoserver:2.24.2
    container_name: supadsp-geoserver
    ports:
      - "${GEOSERVER_PORT:-8082}:8080"
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-changeme}
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    restart: unless-stopped

  # ---- Martin (Vector Tiles) ----
  martin:
    image: ghcr.io/maplibre/martin:v0.13.0
    container_name: supadsp-martin
    ports:
      - "${MARTIN_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-supadsp_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-supadsp}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: supadsp-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:11.1.0
    container_name: supadsp-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  # ---- Central Orchestrator & Multi-Agent Backend Services ----
  supervisor-orchestrator:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: supadsp-supervisor-orchestrator
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - POSTGRES_URL=postgresql://supadsp_user:changeme@postgres:5432/supadsp
      - REDIS_URL=redis://:changeme@redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
  geoserver_data:
  prometheus_data:
  grafana_data:
